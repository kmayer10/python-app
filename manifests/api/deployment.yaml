apiVersion: apps/v1
kind: Deployment
metadata:
  name: pythonapp-api
spec:
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: ImageName
        resources:
          limits:
            memory: "75Mi"
            cpu: "75m"
        ports:
        - containerPort: 8000
